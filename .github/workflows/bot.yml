name: Telegram Bot Runner
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Force Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          npm init -y
          npm install telegraf dotenv node-telegram-bot-api
          MAIN_FILE=$(find . -name "*.js" -not -path "*/node_modules/*" -not -path "*/.github/*" | head -n 1)
          echo "Запускаем главный файл: $MAIN_FILE"
          node "$MAIN_FILE"
