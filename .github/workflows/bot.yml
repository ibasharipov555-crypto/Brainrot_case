name: Telegram Bot Runner
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files structure
        run: |
          echo "=== ТЕКУЩАЯ ПАПКА ==="
          pwd
          echo "=== ЧТО НАХОДИТСЯ В КОРНЕ ==="
          ls -la
          echo "=== ЧТО НАХОДИТСЯ В ПОДПАПКАХ ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          
          
