name: Telegram Bot Runner New
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Поиск файлов проекта
        run: |
          echo "=== ГДЕ МЫ НАХОДИМСЯ ==="
          pwd
          echo "=== ВСЕ ФАЙЛЫ В РЕПОЗИТОРИИ ==="
          find . -maxdepth 3 -not -path '*/.*'
  
